<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Télécommande Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { background-color: #141419; color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .section { background: #2c2c35; border-radius: 12px; padding: 15px; }
        h2 { font-size: 14px; color: #8e8e93; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* Composants de base */
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        input[type=text], input[type=password] { padding: 10px; border-radius: 8px; border: none; background: #1a1a24; color: white; flex: 1; font-size: 16px; text-align: center; }
        
        /* Éclairage */
        .btn-toggle { background: #444; color: white; padding: 12px 20px; }
        .btn-toggle.on { background: #ffcc00; color: black; box-shadow: 0 0 15px rgba(255,204,0,0.5); }
        input[type=range] { width: 100%; margin-top: 15px; accent-color: #ffcc00; }
        input[type=color] { border: none; border-radius: 8px; width: 50px; height: 40px; cursor: pointer; background: transparent; }

        /* Media */
        .media-controls { display: flex; justify-content: space-around; }
        .btn-media { background: #3a3a45; color: white; padding: 15px 25px; font-size: 18px; }
        .btn-media:active { background: #00d2ff; }

        /* Serrure & Envoyer */
        .btn-action { background: #007bff; color: white; padding: 10px 20px; }

        /* Alarme */
        .btn-alarme { width: 100%; background: #ff3b30; color: white; padding: 15px; font-size: 16px; margin-top: 10px; }
        
        /* Overlay Alerte Intrusion */
        #alerte-intrusion { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #alerte-intrusion h1 { font-size: 40px; margin-bottom: 10px; }
        .btn-fermer-alerte { background: white; color: red; padding: 15px 30px; font-size: 18px; margin-top: 20px; }

        #status { font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>

    <h1 style="margin: 0; font-size: 20px; text-align: center;">Maison Connectée</h1>

    <!-- LUMIÈRE RGB -->
    <div class="section">
        <h2>💡 Éclairage RGB</h2>
        <div class="row">
            <input type="color" id="couleurLumiere" value="#ffcc00" onchange="changerCouleur()">
            <button id="btnAmpoule" class="btn-toggle" onclick="toggleAmpoule()">Allumer</button>
        </div>
        <input type="range" id="sliderLum" min="10" max="100" value="100" onchange="changerLuminosite()">
    </div>

    <!-- MULTIMÉDIA -->
    <div class="section">
        <h2>🎵 Jukebox</h2>
        <div class="media-controls">
            <button class="btn-media" onclick="ctrlMedia('PLAY')">▶️</button>
            <button class="btn-media" onclick="ctrlMedia('PAUSE')">⏸️</button>
            <button class="btn-media" onclick="ctrlMedia('NEXT')">⏭️</button>
        </div>
    </div>

    <!-- DIGICODE SERRURE -->
    <div class="section">
        <h2>🔐 Serrure d'entrée</h2>
        <div class="row">
            <input type="password" id="codeSerrure" placeholder="Code PIN...">
            <button class="btn-action" onclick="envoyerCode()">Ouvrir</button>
        </div>
    </div>

    <!-- ALARME MANUELLE -->
    <button class="btn-alarme" id="btnAlarme" onclick="toggleAlarme()">🚨 ACTIVER ALARME</button>
    <div id="status">Connexion en cours...</div>

    <!-- POPUP INTRUSION CACHÉE -->
    <div id="alerte-intrusion">
        <h1>⚠️ INTRUSION DETECTÉE</h1>
        <p>Un mouvement a été repéré dans le salon !</p>
        <button class="btn-fermer-alerte" onclick="fermerAlerte()">J'ai compris</button>
    </div>

    <script>
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const prefix = 'mon_site_test/domotique/';
        
        let etatAmpoule = "OFF";
        let etatAlarme = "OFF";

        client.on('connect', () => {
            document.getElementById('status').innerText = "Connecté à la centrale.";
            client.subscribe(prefix + 'mouvement'); // Écoute le détecteur de mouvement
        });

        // Le mobile réagit si le PC signale un mouvement !
        client.on('message', (topic, message) => {
            if (topic === prefix + 'mouvement' && message.toString() === "INTRUSION") {
                document.getElementById('alerte-intrusion').style.display = "flex";
                // Fait vibrer le téléphone (Si le navigateur l'autorise)
                if ("vibrate" in navigator) {
                    navigator.vibrate([500, 200, 500, 200, 1000]);
                }
            }
        });

        function fermerAlerte() {
            document.getElementById('alerte-intrusion').style.display = "none";
        }

        function toggleAmpoule() {
            etatAmpoule = (etatAmpoule === "OFF") ? "ON" : "OFF";
            const btn = document.getElementById('btnAmpoule');
            btn.innerText = (etatAmpoule === "ON") ? "Éteindre" : "Allumer";
            btn.classList.toggle('on');
            client.publish(prefix + 'ampoule', etatAmpoule);
        }

        function changerLuminosite() {
            client.publish(prefix + 'luminosite', document.getElementById('sliderLum').value.toString());
        }

        function changerCouleur() {
            client.publish(prefix + 'couleur', document.getElementById('couleurLumiere').value);
        }

        function ctrlMedia(action) {
            client.publish(prefix + 'media', action);
        }

        function envoyerCode() {
            const code = document.getElementById('codeSerrure').value;
            client.publish(prefix + 'serrure', code);
            document.getElementById('codeSerrure').value = ""; // Vide le champ après envoi
        }

        function toggleAlarme() {
            etatAlarme = (etatAlarme === "OFF") ? "ON" : "OFF";
            client.publish(prefix + 'alarme', etatAlarme);
            const btn = document.getElementById('btnAlarme');
            if (etatAlarme === "ON") {
                btn.style.background = "#8b0000";
                btn.innerText = "🛑 ARRÊTER L'ALARME";
            } else {
                btn.style.background = "#ff3b30";
                btn.innerText = "🚨 ACTIVER ALARME";
            }
        }
    </script>
</body>
</html>
