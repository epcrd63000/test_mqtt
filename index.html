<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Télécommande Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #141419; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .section { background: #2c2c35; border-radius: 15px; padding: 20px; }
        h2 { font-size: 16px; color: #8e8e93; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        /* Ampoule & Slider */
        .row { display: flex; justify-content: space-between; align-items: center; }
        .btn-toggle { background: #444; border: none; color: white; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-toggle.on { background: #ffcc00; color: black; box-shadow: 0 0 15px rgba(255,204,0,0.5); }
        input[type=range] { width: 100%; margin-top: 15px; accent-color: #ffcc00; }

        /* Écran / Message */
        .input-group { display: flex; gap: 10px; }
        input[type=text] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #1a1a24; color: white; font-size: 16px; }
        .btn-send { background: #007bff; color: white; border: none; border-radius: 8px; padding: 0 20px; font-weight: bold; cursor: pointer; }

        /* Thermostat */
        .temp-display { font-size: 32px; font-weight: bold; color: #00d2ff; text-align: center; }

        /* Bouton Alarme */
        .btn-alarme { width: 100%; background: #ff3b30; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        
        #status { font-size: 12px; color: #666; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <h1 style="margin: 0; font-size: 24px; text-align: center;">Maison Virtuelle</h1>

    <!-- SECTION LUMIÈRE -->
    <div class="section">
        <h2>💡 Éclairage</h2>
        <div class="row">
            <span>État</span>
            <button id="btnAmpoule" class="btn-toggle" onclick="toggleAmpoule()">Allumer</button>
        </div>
        <input type="range" id="sliderLum" min="10" max="100" value="100" onchange="changerLuminosite()">
    </div>

    <!-- SECTION ÉCRAN -->
    <div class="section">
        <h2>📺 Message LCD</h2>
        <div class="input-group">
            <input type="text" id="msgInput" placeholder="Tapez un message...">
            <button class="btn-send" onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <!-- SECTION TEMPÉRATURE -->
    <div class="section">
        <h2>🌡️ Température Salon</h2>
        <div class="temp-display" id="mobileTemp">--.- °C</div>
    </div>

    <!-- SECTION ALARME -->
    <button class="btn-alarme" id="btnAlarme" onclick="toggleAlarme()">🚨 DÉCLENCHER ALARME</button>

    <div id="status">Connexion en cours...</div>

    <script>
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        const prefix = 'mon_site_test/domotique/';
        
        let etatAmpoule = "OFF";
        let etatAlarme = "OFF";

        client.on('connect', () => {
            document.getElementById('status').innerText = "Connecté à la centrale.";
            // La télécommande s'abonne uniquement à la température pour la lire
            client.subscribe(prefix + 'temperature');
        });

        // Réception des données du PC (Température)
        client.on('message', (topic, message) => {
            if (topic === prefix + 'temperature') {
                document.getElementById('mobileTemp').innerText = message.toString() + " °C";
            }
        });

        // 1. Bouton Ampoule
        function toggleAmpoule() {
            etatAmpoule = (etatAmpoule === "OFF") ? "ON" : "OFF";
            const btn = document.getElementById('btnAmpoule');
            btn.innerText = (etatAmpoule === "ON") ? "Éteindre" : "Allumer";
            btn.classList.toggle('on');
            client.publish(prefix + 'ampoule', etatAmpoule);
        }

        // 2. Slider Variateur
        function changerLuminosite() {
            const val = document.getElementById('sliderLum').value;
            client.publish(prefix + 'luminosite', val.toString());
        }

        // 3. Envoyer Texte
        function envoyerMessage() {
            const texte = document.getElementById('msgInput').value;
            if (texte !== "") {
                client.publish(prefix + 'ecran', texte);
                document.getElementById('msgInput').value = ""; // Vider le champ
            }
        }

        // 4. Bouton Alarme
        function toggleAlarme() {
            etatAlarme = (etatAlarme === "OFF") ? "ON" : "OFF";
            client.publish(prefix + 'alarme', etatAlarme);
            const btn = document.getElementById('btnAlarme');
            if (etatAlarme === "ON") {
                btn.style.background = "#8b0000";
                btn.innerText = "🛑 ARRÊTER L'ALARME";
            } else {
                btn.style.background = "#ff3b30";
                btn.innerText = "🚨 DÉCLENCHER ALARME";
            }
        }
    </script>
</body>
</html>
