<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Télécommande MQTT Ampoule</title>
    <!-- Bibliothèque MQTT via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            margin: 0;
            padding: 0;
            background-color: #141419; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 { 
            font-size: 24px;
            font-weight: 400; 
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 40px;
        }

        /* --- ZONE DE L'INTERRUPTEUR MOBILE --- */
        .switch-container {
            position: relative;
            margin-bottom: 40px;
        }

        /* Le gros bouton circulaire tactile */
        .power-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #2c2c35;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Icône Power en SVG */
        .power-icon {
            width: 65px;
            height: 65px;
            fill: none;
            stroke: #555562;
            stroke-width: 5;
            stroke-linecap: round;
            transition: all 0.3s ease;
        }

        /* Effet actif (pression sur l'écran du smartphone) */
        .power-btn:active {
            transform: scale(0.92);
        }

        /* --- ÉTAT ALLUMÉ --- */
        body.is-on {
            background-color: #1c1c16;
        }

        body.is-on .power-btn {
            background: #ffcc00;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.5), inset 0 2px 3px rgba(255,255,255,0.4);
        }

        body.is-on .power-icon {
            stroke: #141419;
            filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.2));
        }

        /* Petit voyant d'état */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
            transition: background-color 0.3s ease;
        }

        .status-dot.connected {
            background-color: #34c759;
            box-shadow: 0 0 8px #34c759;
        }
        
        #status-bar { 
            background-color: #1e1e24;
            padding: 15px;
            font-size: 13px; 
            color: #aeaeac;
            border-top: 1px solid #2c2c35;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Télécommande IoT</h1>
        <div class="subtitle">Contrôle de l'ampoule virtuelle</div>
        
        <div class="switch-container">
            <button class="power-btn" id="mainButton" onclick="basculerAmpoule()">
                <svg class="power-icon" viewBox="0 0 24 24">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <div id="status-bar">
        <span class="status-dot" id="dot"></span>
        <span id="status-text">Connexion au broker...</span>
    </div>

    <script>
        // Version optimisée mobile (WebSockets Port 8884 sécurisé obligatoire pour les smartphones)
        const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
        const topic = 'mon_site_test/ampoule';
        let etatAmpoule = "OFF";

        const client = mqtt.connect(brokerUrl);
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');
        const bodyEl = document.body;

        client.on('connect', () => {
            statusText.innerText = "Connecté à HiveMQ (Prêt)";
            dot.classList.add('connected');
            client.subscribe(topic);
        });

        client.on('error', (err) => {
            statusText.innerText = "Erreur de réseau";
            dot.classList.remove('connected');
        });

        client.on('close', () => {
            statusText.innerText = "Déconnecté du serveur";
            dot.classList.remove('connected');
        });

        // Met à jour l'interface de la télécommande si l'état change ailleurs (Siri, autre site, etc.)
        client.on('message', (receivedTopic, message) => {
            if (receivedTopic === topic) {
                const commande = message.toString();
                if (commande === "ON") {
                    bodyEl.classList.add('is-on');
                    etatAmpoule = "ON";
                } else if (commande === "OFF") {
                    bodyEl.classList.remove('is-on');
                    etatAmpoule = "OFF";
                }
            }
        });

        function basculerAmpoule() {
            const prochainEtat = (etatAmpoule === "ON") ? "OFF" : "ON";
            // Publication immédiate du nouvel état
            client.publish(topic, prochainEtat);
        }
    </script>
</body>
</html>
